version: 2

# ОНОВЛЕННЯ ПРИХОДЯТЬ САМІ, І ЦЕ НЕ ЗРУЧНІСТЬ (DEPENDENCIES-v9 § 3,
# `DEP-DEPENDABOT`).
#
# Без цього файлу питання «чи є відома вразливість у тому, що їде у браузер
# відвідувача» ставить лише той, хто про нього згадав. `npm audit` у CI ловить
# уже оприлюднену діру в поточних версіях; Dependabot приносить версію, у якій
# її немає, — і робить це тоді, коли її випустили, а не тоді, коли хтось
# зазирнув.
updates:
  # ПАТЧІ Й МІНОРИ — ОДНИМ PR, МАЖОРИ — ОКРЕМИМИ.
  #
  # Причина в тому, як їх читають. Пачка патчів проходить очима за хвилину й
  # зеленим CI; мажор вимагає прочитати changelog, і змішаний PR перетворює
  # обидві роботи на одну довгу, яку відкладають.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Мажори в групу не входять — Dependabot відкриє на кожен свій PR.

  # Дії GitHub — та сама залежність, лише виконується вона з правами на
  # репозиторій. Застаріла дія ще й тягне за собою знятий рантайм: попередження
  # про node20 знімається не підняттям номера релізу, а мажором дії
  # (`CI-ACTION-RUNTIME`).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
