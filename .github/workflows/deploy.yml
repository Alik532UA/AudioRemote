name: Deploy to GitHub Pages

# ГЕЙТИ БІЖАТЬ І НА PULL REQUEST, А НЕ ЛИШЕ ПІСЛЯ МЕРЖУ (`CI-PRE-MERGE-GATE`).
#
# Робота тут іде просто в `main`, тож довго здавалося, що PR не буває. Вони є, і
# щотижня: Dependabot приносить нові версії того, що їде у браузер відвідувача
# (`.github/dependabot.yml`). До цього рядка такий PR не запускав НІЧОГО — ні
# типів, ні лінта, ні юнітів, ні гейта над збіркою, ні браузера. Тобто рівно ті
# зміни, які найлегше злити «бо зелено», були єдиними, де дивитися не було на що.
#
# Публікація при цьому лишається подією гілки `main`: на PR виконується все,
# крім викладання правил і самого деплою.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# `cancel-in-progress: false` навмисно. Пуш пачкою комітів разом із `true`
# скасовує всі проміжні прогони, лишаючи останній: прогін, який УПЕРШЕ виконав
# би щойно доданий гейт, не завершується ніколи. Гейт при цьому виглядає
# робочим — він просто не виконувався жодного разу.
#
# Група — ПО ГІЛЦІ, а не одна на весь проєкт. З однією групою й без скасування
# прогін PR ставав би в чергу перед прогоном `main`: деплой чекав би на чужу
# гілку, і виглядало б це як підвислий випуск.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ПРАВИЛА ДОСТУПУ — окремим джобом, і не заради швидкості.
  #
  # Це єдина межа безпеки онлайн-частини й єдина частина проєкту, стану якої не
  # видно ні в `src/`, ні у `build/`: правила виконуються на боці Firebase.
  # Решта гейтів проходить однаково і на правильних правилах, і на «дозволити
  # все» — тобто дірку в них не побачив би жоден інший крок.
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Емулятор Realtime Database — java-процес. Без цього кроку
      # `emulators:exec` падає з «java not found», і це виглядає як зламані
      # правила.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Правила бази на емуляторі
        run: npm run check:rules

  # ПРАВИЛА ВИКЛАДАЮТЬСЯ В БОЙОВУ БАЗУ — і саме цього тут бракувало.
  #
  # Джоб `rules` вище лише ПЕРЕВІРЯЄ їх на емуляторі. Виглядає це як «правила в
  # порядку», але в бойовій базі лишаються ті, які востаннє вставили руками в
  # консолі. Між пушем і тим вставлянням код уже пише поле, про яке правило не
  # знає, а `$other: false` відкидає незнане поле разом з УСІМ записом: дошка
  # тихо перестає оголошуватися, і пульт пише «на плеєрі ще не обрано папку».
  # Так сталося тричі — з полем `key`, потім з `icon` і `auto`.
  #
  # Викладається ПЕРЕД збіркою (`build-and-deploy` чекає на цей джоб): нові
  # правила сумісні зі старим кодом, а старі з новим — ні.
  #
  # Потрібен секрет `FIREBASE_SERVICE_ACCOUNT` — JSON сервісного акаунта з
  # роллю «Firebase Realtime Database Admin». Без нього крок ПРОПУСКАЄТЬСЯ з
  # попередженням, а не валить деплой: дошка має лишатися розгортаною й тому,
  # хто форкнув репозиторій і не має доступу до чужої бази.
  publish-rules:
    needs: rules
    # На PR цього job'а немає зовсім: він ПИШЕ в бойову базу школи, а гілка, яку
    # ще ніхто не подивився, права міняти правила не має. Перевірка правил на
    # емуляторі (`rules` вище) на PR виконується як завжди.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    # Секрет читається В ENV, а не в `if` кроку: так умову видно однаково й у
    # форку, де секрету немає зовсім.
    env:
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Секрета немає — правила лишаються як є
        if: ${{ env.SERVICE_ACCOUNT == '' }}
        run: |
          echo "::warning title=Правила не викладені::Немає секрету FIREBASE_SERVICE_ACCOUNT, тож правила в базі лишилися старі. Вставте свіжий database.rules.json у Firebase Console руками, інакше база відкине бібліотеку з новими полями."

      # Кроку «ідентифікатора проєкту немає» тут більше немає, і це не
      # спрощення: ідентифікатор перестав бути налаштуванням. Він лежить у
      # `.firebaserc` і в `src/lib/net/firebase.ts`, тобто в git, і бракувати
      # його може хіба що разом із репозиторієм
      # (SECURITY-v9 § 4.2.1, `SEC-CONFIG-IN-SOURCE`).

      # КЛЮЧ СЕРВІСНОГО АКАУНТА ЖИВЕ РІВНО ОДИН КРОК.
      #
      # Прибирає його `trap … EXIT`, а не `rm` наприкінці, і різниця тут не
      # стилістична: якщо `deploy` упаде — а падає він щоразу, коли правила не
      # приймаються, тобто саме тоді, коли це найімовірніше, — рядок із `rm` не
      # виконається взагалі, і файл із ключем долежить на раннері до кінця
      # jobʼа разом із рештою кроків (CI-CD-AND-TOOLS-v9 § 2, `CI-SECRET-EPHEMERAL`).
      #
      # `umask 077` перед записом: типові права на файл у раннері дають читання
      # всім, а в кроках нижче може виконуватися будь-що.
      - name: Викласти правила
        if: ${{ env.SERVICE_ACCOUNT != '' }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          (umask 077; printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json")
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15 deploy --only database --non-interactive

      # ПЕРЕВІРКА ПІСЛЯ ВИКЛАДЕННЯ — і вона не дублює крок вище.
      #
      # «Команда не впала» і «в базі тепер ця редакція» — різні твердження.
      # Пункт «Штамп версії правил не зроблений» у PROJECT-CONTEXT.md стояв
      # саме про цей розрив; пряме порівняння закриває його дешевше за штамп і
      # не вимагає вписувати умову в самі правила.
      #
      # Тут 2026-09-21 усе зійшлося байт у байт, а в сусідньому Slovko тією ж
      # перевіркою знайшлася редакція на сім місяців старша за файл. Різниця
      # була не в акуратності, а в тому, що ніхто не дивився.
      - name: У базі справді те, що в git
        if: ${{ env.SERVICE_ACCOUNT != '' }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          (umask 077; printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json")
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            node scripts/verify-deployed-rules.mjs

  build-and-deploy:
    # Правила йдуть ПЕРШИМИ: нові сумісні зі старим кодом, старі з новим — ні.
    needs: publish-rules
    # На PR job вище ПРОПУЩЕНО, а пропущена залежність за замовчуванням
    # пропускає й того, хто на неї чекає, — тобто без цього рядка гейти на PR
    # не виконалися б узагалі, і в переліку прогонів це читалося б як «нічого
    # не потрібно».
    #
    # Умова названа подією, а не станом «не впало»: на пуші в `main` вимагається
    # саме УСПІХ викладання правил. Інакше червоний `rules` (правила зламані)
    # пропускав би `publish-rules`, а «пропущено» зійшло б за дозвіл деплою.
    #
    # `!cancelled()`, а не `always()`: скасований прогін лишається скасованим.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs['publish-rules'].result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Емулятор бази — java-процес, і браузерний набір піднімає його сам
      # (`playwright.config.ts`). Без цього кроку описи ролей падають із
      # «java not found», і виглядає це як зламаний застосунок.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Типи
        run: npm run check

      # `!cancelled()` на кожному гейті: інакше перше падіння ховає решту, і
      # замість повного списку проблем приходить по одній за прогін.
      - name: Ідіоми
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Формат
        if: ${{ !cancelled() }}
        run: npx prettier --check src

      # ОКРЕМИМ ПРОЦЕСОМ, І САМЕ ТОМУ ОКРЕМИМ КРОКОМ.
      #
      # Перевірка «чи всі файли перевірок підхоплені раннером», запущена самим
      # раннером, зникає разом із тим, що мала знайти: звужена маска `include`
      # викидає і її, а прогін звітує успіх (AI-AGENT-PITFALLS-v9 § 1.3.1).
      - name: Кожну перевірку хтось запускає
        if: ${{ !cancelled() }}
        run: npm run check:runners

      - name: Юніт-перевірки
        if: ${{ !cancelled() }}
        run: npm test

      # АУДИТ САМЕ ПРОД-ЗАЛЕЖНОСТЕЙ, а не всіх.
      #
      # `--omit=dev` тут не послаблення, а умова того, щоб крок узагалі лишився
      # ввімкненим: у браузер відвідувача їде лише те, що в `dependencies`, а
      # інструменти збірки дають потік low-порушень, через які гейт швидко
      # починають ігнорувати, а потім і вимикають. Поріг `high`: критичне й
      # високе зупиняє деплой, решта лишається в Dependabot-PR
      # (DEPENDENCIES-v9 § 3).
      - name: Аудит прод-залежностей
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

      # БАЗОВИЙ ШЛЯХ ЗАДАЄТЬСЯ ТУТ, А НЕ В КОНФІГУ.
      #
      # `svelte.config.js` читає `BASE_PATH` і лише за її відсутності бере
      # `/AudioRemote`. Переїзд на власний домен коштуватиме зміни цього рядка,
      # а не пошуку константи по коду.
      #
      # Значення Firebase публічні за побудовою — вони лежать у бандлі, і
      # приховати їх неможливо. Тому ЗМІННІ, а не секрети
      # (SECURITY-v9 § 4.2, `SEC-PUBLIC-AS-VARIABLE`).
      #
      # Доти тут стояли секрети з поясненням «не заради таємниці, а щоб форк не
      # бив у чужу базу». Мета правильна, засіб — ні: форк не дістає ні
      # секретів, ні змінних, тож і те, і те її виконує однаково. А ціну
      # секрети мають: провайдер маскує їхнє значення скрізь, і в журналі
      # прогону стоїть `***` замість того, що поїхало. У сусідньому `Slovko`
      # саме через це сім місяців не було видно, що правила викладаються не
      # туди.
      - name: Збірка
        id: build
        if: ${{ !cancelled() }}
        run: npm run build
        env:
          BASE_PATH: /AudioRemote
          # АДРЕСА RTDB — без неї онлайн ламається МОВЧКИ: SDK виводить адресу з
          # `projectId` і йде на американську `*.firebaseio.com`, якої в цього
          # проєкту немає, а CSP дозволяє лише `*.firebasedatabase.app`.

      # Єдиний гейт, який бачить дефекти, невидимі в `src/`: базовий шлях у
      # посиланнях, CSP у `<meta>` замість заголовка, маніфест PWA і те, що
      # зібраний воркер не містить безумовного `skipWaiting()`.
      - name: Гейт над збіркою
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:build

      # Бюджет міряється КРИТИЧНИМ ШЛЯХОМ сторінки — усіма чанками, на які вона
      # посилається, — а не текою `entry/`: у ній два кілобайти, і гейт над нею
      # був би завжди зеленим. Головне, що він стереже: `firebase` важить більше
      # за весь інший код разом і мусить лишатися динамічним імпортом.
      - name: Бюджет бандла
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:bundle

      # БРАУЗЕР — ДВІ ЧАСТИНИ, І ВОНИ ПРО РІЗНЕ.
      #
      # Над АРТЕФАКТОМ (`shell.spec.ts`): чи пустила політика безпеки свій же
      # інлайн-скрипт теми, чи `light-dark()` перемальовує сторінку, чи віддає
      # хостинг `404.html` саме з кодом 404. Усе це ламається без жодної
      # помилки на екрані.
      #
      # Над ПОВЕДІНКОЮ ДВОХ РОЛЕЙ (`board.spec.ts`): присутність, команди й
      # пароль у адресі дошки — домовленість МІЖ пристроями, якої всередині
      # одного процесу не існує. Піднімає емулятор бази й dev-сервер сам.
      #
      # Ставиться ЛИШЕ chromium: приймач працює тільки в Chrome або Edge
      # (File System Access API), тож firefox і webkit тут перевіряли б те,
      # чим однаково не користуються, — і коштували б утричі довше.
      #
      # Крок іде ПІСЛЯ збірки й над нею: проєкт `identity` першим ділом
      # звіряє версію, яку віддає порт, із `package.json` — прогін проти
      # старої теки `build/` був би зеленим і не довів би нічого.
      - name: Браузер
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          BASE_PATH: /AudioRemote

      # СЛІД ПРОГОНУ АРТЕФАКТОМ НЕ ВИВАНТАЖУЄТЬСЯ, і це рішення, а не пропуск.
      # `actions/upload-artifact` станом на 2026-09-21 стоїть на `node20` і в
      # v4, і в v5 (прочитано з action.yml обох) — тобто заради зручності в
      # workflow заїхав би знятий рантайм, який спершу лише попереджає
      # (`CI-ACTION-RUNTIME`). Звіт Playwright у логу й так містить помилку,
      # журнал викликів і фрагмент коду; trace лишається для локального
      # прогону, де він і потрібен.

      - name: Збірка не змінює відстежувані файли
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code

      # ПУБЛІКУЄ ЛИШЕ `main`. На PR усі гейти вище вже відпрацювали — саме
      # заради них прогін і запускався, — а викладати на хостинг школи гілку,
      # якої ще ніхто не подивився, нема за що.
      - name: Публікація
        if: ${{ github.event_name != 'pull_request' && steps.build.outcome == 'success' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
