				`color-scheme: light dark` ОБОВ'ЯЗКОВИЙ: без нього `light-dark()`
				мовчки віддає перший аргумент.

				`light-dark()` тут лише для КОЛЬОРУ. Довжини, тіні й `url()`
				через неї не проходять — властивість зникає цілком, і жоден
				гейт про це не скаже.

				СХЕМА ОГОЛОШУЄТЬСЯ ЛИШЕ НА <html>, І ЦЕ НЕ СТИЛЬ ЗАПИСУ.

				`color-scheme` успадковується, а перемикач тем ставить
				`data-theme` на <html> — тобто правила нижче міняють схему саме
				йому. Доки той самий рядок стояв і для `body`, у <body> була
				ВЛАСНА `light dark`, яка перекривала успадковану: <html> ставав
				світлим, а <body> — той, що малює фон сторінки, — далі питав
				системну перевагу й лишався темним.

				Симптом рівно такий, який найважче зв'язати з причиною: тема
				перемикається (атрибут є, сховище записане, кнопка світиться),
				а сторінка не міняє кольору. Заміряно в браузері 2026-09-19;
				стереже `src/css-tokens.test.ts`.
			*/
			html {
				color-scheme: light dark;
				background-color: light-dark(#f5f5f5, #181818);
			}

			html,

				margin: 0;
				padding: 0;
			}

			/*
				`only light`, а не просто `light`. Android Chrome із темною темою
				САМОГО браузера перефарбовує кожну сторінку, яку вважає світлою й
				без власної темної теми (Auto Dark Theme); ознака, за якою він це
				вирішує, — оголошена схема документа, і голе `light` її й

				вона не впливає ніяк.
			*/
			html[data-theme='light'] {
				color-scheme: only light;
			}

			(function () {

				}
