[package]
name = "audioremote"
version = "0.1.0"
description = "AudioRemote — приймач для творчої школи"
authors = ["Alik Zapolnov"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# `_lib`, бо ім'я бібліотеки не може збігатися з ім'ям пакета на Windows.
name = "audioremote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ТІЛЬКИ ДЛЯ ПЕРЕВІРКИ МЕЖІ, і саме тому в dev-залежностях.
#
# `capabilities/default.json` називає єдину адресу, якій видано читання й запис
# файлів. Прочитати цей рядок очима недостатньо: він тлумачиться як URLPattern,
# а в URLPattern порожній шлях мовчки перетворюється на `*` (див.
# `tauri-utils-2.9.3/src/acl/mod.rs`, `RemoteUrlPattern::from_str`). Тобто
# «звужено» й «виглядає звуженим» — різні речі, і різницю видно лише прогоном.
#
# Версія збігається з тією, яку тягне `tauri` (див. Cargo.lock): перевіряти
# треба ТИМ САМИМ кодом, що судитиме в застосунку, а не схожим.
[dev-dependencies]
tauri-utils = "2.9.3"
url = "2"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# ПАПКА МУСИТЬ ПЕРЕЖИТИ ПЕРЕЗАПУСК ЗАСТОСУНКУ.
#
# Дозвіл, виданий діалогом, живе в пам'яті процесу: закрили вікно — і папка,
# обрана вчора, знову недоступна, хоч шлях до неї записаний. Цей плагін
# зберігає виданий дозвіл на диск і повертає його при старті. Без нього вся
# затія («папка за замовчуванням, нічого не питати») не працює.
tauri-plugin-persisted-scope = "2"

[profile.release]
# Розмір тут важить більше за останні відсотки швидкості: застосунок цілий день
# чекає натискання, а качати його доведеться на кожен комп'ютер школи.
opt-level = "s"
lto = true
strip = true
