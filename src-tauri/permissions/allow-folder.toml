"$schema" = "schemas/schema.json"

# Команди самого застосунку теж проходять через дозволи, і для сторінки з
# мережі це видно одразу: без цього файлу `allow_folder` відповідає «not
# allowed», хоч вона є в `generate_handler!`. Вікну зі вшитою сторінкою дозвіл
# дається неявно — нашому ні, і це правильно: сторінка приходить із сервера.
[[permission]]
identifier = "allow-folder"
description = "Розширити область дії файлів на папку, яку щойно обрали в діалозі."
commands.allow = ["allow_folder"]
